language: node_js
node_js:
  - "20"    
branches:
  only:
    - main

cache:
  npm: true

install:
  - npm install  
script:

  - if npm run | grep -q " build"; then npm run build; else echo "No build script; usaré build/ existente"; fi

  - if [ -f build/index.html ]; then cp build/index.html build/404.html; else echo "No build/index.html para copiar"; fi

deploy:
  provider: pages
  skip_cleanup: true
  github_token: $github_token
  local_dir: build
  on:
    branch: main
